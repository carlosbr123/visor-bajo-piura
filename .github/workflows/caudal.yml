name: Caudal del día (SNIRH)

# El visor pide el caudal del día al SNIRH directamente desde el navegador de quien lo abre. Esta tarea sólo renueva el último
# dato guardado (datos/caudal_externo.json), que el visor muestra si esa consulta falla. En la prueba del 17-sep-2026 el SNIRH
# no respondió a los servidores de GitHub (tiempo de espera agotado): en ese caso la tarea termina sin cambiar nada.
on:
  schedule:
    - cron: "0 13 * * *"      # 08:00 en Perú
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pandas openpyxl playwright
      - run: python -m playwright install --with-deps chromium
      - run: python actualizar_caudal.py
      - name: ¿Responden los servidores peruanos?
        run: |
          for u in https://www.senamhi.gob.pe/sonics/ https://www.senamhi.gob.pe/ https://snirh.ana.gob.pe/ https://www.ana.gob.pe/; do
            echo "$u -> $(curl -sS -m 25 -o /dev/null -w '%{http_code} en %{time_total}s' "$u" 2>&1 || true)"
          done
      - name: Pronóstico de SONICS (SENAMHI)
        run: python actualizar_sonics.py
      - name: Guardar si cambió
        run: |
          if ! git diff --quiet -- datos/caudal_externo.json datos/sonics_archivo.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add datos/caudal_externo.json datos/sonics_archivo.json
            git commit -m "Caudal del día"
            git push
          fi
