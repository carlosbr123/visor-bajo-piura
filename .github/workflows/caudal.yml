name: Caudal del día (SNIRH)

on:
  schedule:
    - cron: "0 13 * * *"      # 08:00 en Perú
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python actualizar_caudal.py
      - name: Guardar si cambió
        run: |
          if ! git diff --quiet -- datos/caudal_externo.json; then
            git config user.name "actualizacion-automatica"
            git config user.email "actions@users.noreply.github.com"
            git add datos/caudal_externo.json
            git commit -m "Caudal del día"
            git push
          fi
