name: Caudal del día (SNIRH)

# Renueva el pronóstico de GloFAS (Open-Meteo, que sí responde aquí) y, si alguna vez vuelve a responder, el caudal observado del
# SNIRH. Prueba del 17-sep-2026 desde los servidores de GitHub: www.senamhi.gob.pe, snirh.ana.gob.pe y www.ana.gob.pe agotan el
# tiempo de espera a los 25 s. Por eso el visor pide el observado al SNIRH desde el navegador de quien lo abre, y el pronóstico de
# SONICS sólo puede bajarse desde una máquina en el Perú (publicacion/actualizar_sonics.py).
on:
  schedule:
    - cron: "0 13 * * *"      # 08:00 en Perú
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python actualizar_caudal.py
      - name: Guardar si cambió
        run: |
          if ! git diff --quiet -- datos/caudal_externo.json datos/sonics_archivo.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add datos/caudal_externo.json datos/sonics_archivo.json
            git commit -m "Caudal del día"
            git push
          fi
