name: Prueba de red (temporal)

on:
  workflow_dispatch:

jobs:
  probar:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          echo "runner=${{ matrix.runner }} ip=$(curl -s -m 10 https://api.ipify.org || echo ?)"
          for u in https://www.senamhi.gob.pe/sonics/ https://snirh.ana.gob.pe/ https://www.ana.gob.pe/; do
            echo "${{ matrix.runner }} $u -> $(curl -sS -m 25 -o /dev/null -w '%{http_code} en %{time_total}s' "$u" 2>&1 || true)"
          done
